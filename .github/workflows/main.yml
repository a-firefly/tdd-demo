name: Go CI

on:
  # 仅在推送到 main 分支时运行。
  push:
    branches: [main]

permissions:
  # 检出代码只需仓库内容的读取权限。
  contents: read

# 同一工作流、同一分支的新运行会取消尚未结束的旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # 限制整个任务的执行时间，包含环境准备和测试。
    timeout-minutes: 10

    steps:
      - name: Check out code
        # 跟随 v7 主版本标签，接收该系列的后续更新。
        uses: actions/checkout@v7
        with:
          # 后续步骤无需 Git 认证，不保留检出时使用的凭据。
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # 与项目声明的 Go 版本保持一致，避免在工作流中重复维护。
          go-version-file: go.mod

      - name: Test
        # 输出详细结果、禁用测试结果缓存；每个测试包超时为 5 分钟。
        run: go test -v -count=1 -timeout=5m ./...
